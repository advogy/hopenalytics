name: Deploy to Hostinger

# Hostinger shared hosting has no SSH/Node, so the build happens in CI: install Composer + npm
# dependencies, run `npm run build` (see README.md), then package everything into ONE zip and
# upload it (a single FTP transfer, not thousands of file-by-file round trips — vendor/ alone is
# ~8,000 files, which reliably blew past Hostinger's 1-hour FTP session limit under the previous
# full-tree-sync approach). Finally, hit /deploy/run (App\Http\Controllers\DeployController) —
# token-guarded — which extracts the zip in place and runs migrations, since a shell-less host
# can't do either of those itself.
#
# .env, storage/, and public/storage (the storage:link symlink) are deliberately left out of the
# zip — they hold production secrets / runtime data / a symlink a zip extract shouldn't touch,
# and must already exist on the server from the initial manual setup.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Without this, two pushes close together in time each get their own independent runner with no
# ordering guarantee between them — whichever run's final "Trigger extract + migrate" HTTP call
# happens to land on the server LAST wins, regardless of which commit was actually pushed later.
# Confirmed live: a commit's own fix to a file was visibly missing from production immediately
# after its deploy reported success, because an EARLIER commit's slightly-slower run's extract
# executed after it and silently overwrote it back — DeployController::run() never checks
# ZipArchive::extractTo()'s return value either, so this kind of clobber reports as a clean
# success both times. cancel-in-progress: false queues a second push behind the first rather than
# cancelling it mid-extract, which could leave the server in a genuinely half-updated state.
concurrency:
  group: deploy-hostinger
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      # --no-scripts: composer's post-autoload-dump hook runs `artisan package:discover`, which
      # boots the app — and routes/console.php queries the app_settings table right at file-load
      # time (for the auto-fetch schedule), which needs a DB this CI checkout doesn't have. Safe
      # to skip: Laravel rebuilds its package-discovery cache lazily on the real server instead,
      # which does have a working .env/DB.
      - name: Install Composer dependencies
        run: composer install --no-dev --optimize-autoloader --prefer-dist --no-scripts

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install npm dependencies and build assets
        run: |
          npm ci
          npm run build

      - name: Package deploy-payload.zip
        run: |
          zip -rq deploy-payload.zip \
            app bootstrap config database lang resources routes vendor public \
            artisan composer.json composer.lock \
            -x "public/storage/*" -x "public/hot"
          ls -lh deploy-payload.zip

      - name: Upload deploy-payload.zip over FTP
        run: |
          DIR="${{ secrets.HOSTINGER_FTP_SERVER_DIR }}"
          DIR="${DIR#./}"
          DIR="${DIR%/}"
          curl -sS -T deploy-payload.zip \
            "ftp://${{ secrets.HOSTINGER_FTP_HOST }}/$DIR/deploy-payload.zip" \
            --user "${{ secrets.HOSTINGER_FTP_USERNAME }}:${{ secrets.HOSTINGER_FTP_PASSWORD }}"

      - name: Trigger extract + migrate on the server
        run: |
          curl -sS -f -X POST "${{ secrets.DEPLOY_URL }}" \
            -H "X-Deploy-Token: ${{ secrets.DEPLOY_TOKEN }}"
