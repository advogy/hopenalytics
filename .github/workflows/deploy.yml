name: Deploy to Hostinger

# Hostinger shared hosting has no SSH/Node here, so the build has to happen in CI: install
# Composer + npm dependencies, run `npm run build` (see README.md), then upload the result over
# FTP. .env, storage/, and public/storage (the storage:link symlink) are excluded on purpose —
# they hold production secrets / runtime data / a symlink FTP can't transfer, and must already
# exist on the server from the initial manual setup.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: Install Composer dependencies
        run: composer install --no-dev --optimize-autoloader --prefer-dist

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install npm dependencies and build assets
        run: |
          npm ci
          npm run build

      - name: Deploy over FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.HOSTINGER_FTP_HOST }}
          username: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          # Must match wherever the Laravel project root already lives on the server (the
          # folder that contains app/, public/, vendor/, etc.) — set this secret to that path,
          # e.g. "/domains/hopenalytics.id/public_html/" or "/public_html/".
          server-dir: ${{ secrets.HOSTINGER_FTP_SERVER_DIR }}
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/node_modules/**
            **/tests/**
            **/.env
            **/.env.*
            **/storage/**
            **/public/storage/**
            **/public/hot
